# Bun-specific settings live here rather than duplicated across scripts.

[install]
# Pin by default: a casual `bun add` writes 1.2.3, not ^1.2.3.
exact = true
# Wait 7 days (in seconds) before resolving a newly published version, the same
# window as Dependabot's cooldown. Semgrep's bun-missing-minimum-release-age
# rule asks for it.
minimumReleaseAge = 604800

[test]
coverage = true
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = ["*.test.ts"]
