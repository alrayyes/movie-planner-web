# Print only what failed. A passing hook says nothing, so a failure is the one
# thing on screen.
output:
  - failure

# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# Grows a job here the same PR that adds the tool it runs — a linter with no
# hook is a linter you only meet at CI.

# pre-commit may write. Let every fixer run and restage what it touched — a
# commit should not fail over a quote style a tool can settle by itself.
pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Prettier decides the layout, markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    - name: prettier
      glob: "*.{md,yml,yaml,astro}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      # --no-globs: the `globs` in .markdownlint-cli2.yaml are added to any
      # file list, so without it this lints the whole tree, not the commit.
      run: bunx markdownlint-cli2 --no-globs {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: bunx sort-package-json {staged_files}
      stage_fixed: true

    # Fast enough for a commit. LTeX is not — around ten seconds a file — so
    # mechanics run at push instead, where the wait is paid once rather than
    # per commit.
    - name: vale
      glob: "*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/**"
        - "openspec/changes/**"
        - "openspec/specs/**"
      run: vale {staged_files}

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has to
    # load the config its own config extends, and bunx cannot resolve a sibling
    # package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never rewrites tracked files. A hook rewriting files under a push
# leaves the pushed commit and the working tree disagreeing about what was
# reviewed.
#
# Parallel because of that, with one exception: `test` and `check` both write
# the untracked `.astro/` cache (the e2e webServer runs `astro build`), and
# overlapping they fail with `ENOENT ... rename '.astro/content-assets.mjs.tmp'`
# before any test runs (#640). They run one after the other in a group; every
# other job still runs alongside them.
#
# Each job's `glob` is what the pipeline's job covers. scripts/changed-groups.ts
# holds the lists and its test fails when these drift (#727), so a push that
# touches none of a job's files skips it the way ci.yml's `changes` job does.
# The first job to use a list defines it and the rest alias it.
pre-push:
  parallel: true
  jobs:
    - group:
        parallel: false
        jobs:
          - name: check
            glob: &lint
              - "**/*.{ts,tsx,js,mjs,cjs,jsx,json,jsonc,css,astro,svelte}"
              - bun.lock
              - bunfig.toml
              - CLAUDE.md
              - .claude/**
              - .github/workflows/ci.yml
            run: bun run check

          # --retries=2, as CI has (playwright.config.ts): the local `wrangler
          # dev` server this suite drives drops connections under load (workerd
          # `Broken pipe`), which fails a few unrelated tests at random with 30
          # second timeouts, a different few each run and all passing on a rerun
          # (#640). CI retries them; the hook didn't, so it failed about half
          # the time on a busy machine. A test that fails three times in a row
          # still fails.
          - name: test
            glob: &test
              - src/**
              - tests/**
              - scripts/**
              - test/**
              - public/**
              - docs/**
              - "*.md"
              - .github/**
              - package.json
              - bun.lock
              - bunfig.toml
              - tsconfig.json
              - astro.config.mjs
              - playwright.config.ts
              - wrangler.jsonc
              - biome.json
              - .oxlintrc.json
              - .prettierrc.json
              - .commitlintrc.json
              - .gitleaks.toml
              - .ltex.json
              - codecov.yml
              - lefthook.yml
              - release-please-config.json
            run: bun run test:unit && bun run test:e2e --retries=2

    - name: biome
      glob: *lint
      run: bun run lint

    # Tailwind class usage, via Oxlint — narrow scope, just @shadcn/lint's
    # rules (rules/tailwind.md). Biome keeps doing everything else above.
    - name: tailwind
      glob: *lint
      run: bun run lint:tailwind

    # CLAUDE.md and .claude/settings*.json, one file per cclint call.
    - name: claude
      glob: *lint
      run: bun run lint:claude

    # These are `package.json` scripts rather than the commands spelled out,
    # because CI runs the same ones and a literal copied into two files drifts
    # the first time somebody edits one of them.
    - name: prettier
      glob: &prose
        - "**/*.{md,yml,yaml,astro}"
        - .prettierrc.json
        - .prettierignore
        - .markdownlint*
        - package.json
        - bun.lock
      run: bun run format:check

    - name: markdownlint
      glob: *prose
      run: bun run lint:md

    - name: sort-package-json
      glob: *lint
      run: bun run sort-package-json:check

    # Every other linter here runs at commit, at push and in CI. Vale ran at
    # commit and then nothing until CI, because its invocation lived in the
    # workflow as a block of bash with nothing a hook could reuse. It is a
    # script now, and this is the whole-tree run that was missing.
    - name: vale
      run: bun run lint:prose

    # Grammar and spelling. Left out of pre-commit on the grounds that it is a
    # ~300 MB download, which it is — but it caches outside the repository and
    # then costs about ten seconds.
    - name: mechanics
      run: bun run lint:mechanics
