# A real Baikal instance for the caldav-client integration tests — the
# testing rule's "container / integration: real HTTP in containers, not
# mocks" layer. Unit tests (src/lib/caldav/*.test.ts) already cover branches
# and edge cases against a mocked fetch; this layer exists to catch what
# mocks can't: whether the REPORT/PUT/GET/DELETE calls and the iCalendar
# codec actually work against a real CalDAV server, not just against each
# other.
#
# `docker compose -f test/integration/compose.yaml up -d --wait`, then
# `./test/integration/provision-baikal.sh`, then `bun run test:integration`.
# See CONTRIBUTING.md's "Integration tests" section.
#
# No cap_drop/read_only here despite the containers rule's usual runtime
# hardening list: both images are third-party (ckulka/baikal, caddy), used
# ephemerally and locally/in-CI only, never shipped or exposed beyond this
# test run — nginx/php-fpm and Caddy's own cert storage both need real
# write access this isn't worth verifying against for a throwaway
# container. mem_limit and no-new-privileges cost nothing to keep, so they
# stay.
services:
  baikal:
    image: ckulka/baikal:0.10.1-nginx@sha256:434bdd162247cc6aa6f878c9b4dce6216e39e79526b980453b13812d5f8ebf4b
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-o",
          "/dev/null",
          "http://localhost/admin/install/",
        ]
      # Baikal's nginx and php-fpm take a few seconds to come up. Failures
      # inside this window don't count toward `retries`.
      start_period: 10s
      interval: 2s
      timeout: 2s
      retries: 30

  caddy:
    image: caddy:2.11.6@sha256:907efba736324e43f891ccb9d760fe5abe545e313419b3d18d63d4ec670dad8d
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    depends_on:
      baikal:
        condition: service_healthy
    # Ready means the proxy answers over TLS *and* reaches Baikal, which is
    # what `up --wait` and the provisioning script both need. The same page
    # Baikal's own check uses, requested through Caddy; the cert is Caddy's
    # internal CA, trusted by the tests but not by this container.
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "/dev/null",
          "https://localhost:8443/admin/install/",
        ]
      start_period: 5s
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
