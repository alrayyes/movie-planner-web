<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180">
  <!--
    A deliberately abstract, low-detail world outline — not real
    coastline data (no dataset, no external license to track), just
    rough continent-shaped blobs positioned by their approximate
    equirectangular lon/lat (x = lon + 180, y = 90 - lat). This is the
    bundled local asset venue-map's own Leaflet map renders instead of
    a live tile-provider fetch (design.md's zero-network-privacy
    decision) — coarse on purpose, with the "Open in Maps" link next to
    each pin covering anyone who wants real precision.
  -->
  <rect width="360" height="180" fill="#e2e8f0" />
  <g fill="#94a3b8">
    <!-- North America -->
    <path d="M30 25 L75 18 L95 30 L88 55 L70 78 L45 82 L28 65 L20 40 Z" />
    <!-- South America -->
    <path d="M78 92 L100 88 L108 115 L98 150 L82 158 L72 130 L70 105 Z" />
    <!-- Africa -->
    <path d="M168 55 L200 50 L212 80 L205 118 L188 145 L168 140 L158 105 L160 75 Z" />
    <!-- Europe -->
    <path d="M172 25 L200 20 L212 32 L205 48 L180 50 L168 40 Z" />
    <!-- Asia -->
    <path d="M205 15 L280 12 L320 28 L315 55 L280 70 L235 62 L210 45 L200 30 Z" />
    <!-- Australia -->
    <path d="M280 118 L312 115 L320 132 L305 145 L282 142 L275 128 Z" />
  </g>
</svg>
