# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# Two pins Dependabot can't see, and which are updated by hand: the Vale
# version in prose.yml/CONTRIBUTING.md and the gitleaks version in
# gitleaks.yml. Neither lives anywhere Dependabot's ecosystems look.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    # A newly published version can be malicious or unstable before anyone's
    # had a chance to notice — wait a week before proposing it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, because commitlint checks these messages and
      # the version number is computed from them. chore: cuts no release
      # (#686): a release means code under src/ or public/ changed, and a
      # dependency bump alone doesn't. It still deploys — Cloudflare builds
      # every merge to main — it just doesn't get its own version and
      # changelog entry. A bump that needs a code change ships that change
      # as its own feat:/fix: commit. github-actions below stays ci: — it
      # changes the pipeline, not the artifact.
      prefix: chore
      include: scope
    groups:
      bun-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
