# The README's page screenshots, refreshed on release. CI never commits to
# main, but the release job may, so the pictures ride on the release pull
# request: this pushes one commit to its branch, and merging the release
# merges them.
#
# pull_request, not pull_request_target: release-please's branch lives on this
# repo, never a fork, so there's no untrusted checkout to guard against.
name: screenshots

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0"

jobs:
  screenshots:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Prebuilt image with the Playwright browsers, git and gh in it, so no step
    # downloads Chromium. Its bun is not the pinned one; setup-bun below is (#963).
    # The tag must equal the @playwright/test version exactly;
    # scripts/playwright-image.test.ts fails when they differ, so bump both
    # together (#952).
    container:
      image: ghcr.io/alrayyes/ci-playwright:1.64.1@sha256:765bb40296d41f38491a94991273af4cb7a88ce9b136e53b1e5e841c4e694f27
      # Chromium shares memory through IPC; Playwright's Docker guide asks for this.
      options: --ipc=host
    steps:
      # RELEASE_TOKEN, not the default GITHUB_TOKEN: a push made with
      # GITHUB_TOKEN doesn't start the checks the release pull request is
      # waiting for, so the new commit would sit there with none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.RELEASE_TOKEN }}
      # The container runs as root over a workspace the runner owns; git
      # otherwise refuses it with "dubious ownership".
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The image's own bun is whatever it was built with; install the pinned
      # one so this job runs the same bun as the rest (#963).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # This job's own commit comes back as a synchronize event. The pictures
      # carry noise from run to run, so rebuilding them would add a commit
      # every time: stop at our own.
      - name: stop at our own commit
        id: guard
        run: |
          if [ "$(git log -1 --format=%s)" = "docs: refresh the page screenshots" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: bun install
        if: steps.guard.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - name: take the screenshots
        if: steps.guard.outputs.skip != 'true'
        run: bun run screenshots
      # The README's top pair and the About page's tour come from their own
      # spec, which the gallery run above doesn't touch (#929).
      - name: take the README's top pair and the About page's pictures
        if: steps.guard.outputs.skip != 'true'
        run: ./scripts/in-private-network.sh bunx playwright test tests/screenshots.spec.ts
      - name: update the README gallery
        if: steps.guard.outputs.skip != 'true'
        run: bun scripts/readme-gallery.ts
      - name: commit what changed
        if: steps.guard.outputs.skip != 'true'
        run: |
          git add docs/screenshots public/screenshots README.md
          if git diff --cached --quiet; then
            echo "screenshots are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "docs: refresh the page screenshots"
          git push
