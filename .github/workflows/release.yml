# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and keeps a release pull request open carrying the next
# version and the changelog entry; merging that pull request bumps
# package.json, tags the release and writes the notes.
#
# No deploy step here: Cloudflare's own GitHub integration watches this repo
# directly and builds/deploys itself (preview per pull request, production
# on main) — configured on the Cloudflare dashboard, not in this workflow.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag half-written.
concurrency:
  group: release
  cancel-in-progress: false

env:
  LEFTHOOK: "0"

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    steps:
      # release-please calls the GitHub API, which can answer with a secondary
      # rate limit that clears within seconds. Retried here so an unwatched run
      # doesn't sit red until someone notices. wretry.action wraps another
      # action's own uses/with, which nick-fields/retry can't.
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            token: ${{ secrets.RELEASE_TOKEN }}
            config-file: release-please-config.json
            manifest-file: .release-please-manifest.json
