# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: biome check
        run: bun run lint
      - name: sort-package-json --check
        run: bun run sort-package-json:check
      # TypeScript's own package no longer exposes astro check's compiler
      # API past 6.x — see package.json's pinned version and the tracking
      # issue linked there before bumping it.
      - name: astro check
        run: bun run check

  # Dependabot alerts alone miss the window between a vulnerability's
  # disclosure and Dependabot's own next scan — this runs the ecosystem's
  # own audit tool on every push instead.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      # A red run can be a transient registry failure, not a real finding
      # (rules/ci.md) — retry once before treating it as one.
      #
      # GHSA-rgj7-g3m4-5g8c (sharp, via wrangler > miniflare) is ignored:
      # tracked at #469, blocked upstream until miniflare bumps its own
      # sharp pin — not something this repo's lockfile can fix. Any other
      # advisory still fails this job.
      - name: bun audit
        run: |
          bun audit --ignore GHSA-rgj7-g3m4-5g8c ||
            (sleep 5 && bun audit --ignore GHSA-rgj7-g3m4-5g8c)

  # Biome's pattern-based rules (lint, above) can't do cross-file taint
  # tracking; this is the separate security pass that can — the free
  # Semgrep Registry ruleset, no paid tier or account needed.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c # 1.175.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: semgrep scan --config auto --error

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      # `--with-deps` shells out to `apt-get` against Google's own Chrome
      # repo, not Ubuntu's mirrors — a repo that flakes on its own rotation
      # with a Hash Sum mismatch, unrelated to anything in this repo.
      # ubuntu-24.04 runners already ship the system libraries Playwright's
      # own downloaded Chromium needs, so this skips that dependency
      # entirely rather than racing it. Retry once regardless, since a
      # download can still fail transiently for unrelated reasons.
      - name: install playwright's browser
        run: |
          bunx playwright install chromium ||
            (sleep 5 && bunx playwright install chromium)
      - name: playwright test
        # webServer builds and serves through wrangler itself, the same
        # thing the Cloudflare Worker deploy runs — see playwright.config.ts.
        # bunfig.toml turns coverage on for every `bun test` run, so
        # coverage/lcov.info comes out of this step as a side effect.
        run: bun run test
      # Visibility, not a gate (rules/testing.md) — never fails the job,
      # even now that the repo's connected to Codecov.
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # #195: tests/screenshots.spec.ts overwrites docs/screenshots/*.png
      # on every run — uploaded here so a reviewer can eyeball whether the
      # README's own checked-in copies (committed separately, since CI
      # never commits on its own — see CLAUDE.md) still match, without
      # needing to run the suite themselves.
      - name: upload README screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshots
          path: docs/screenshots/
          retention-days: 7
      - name: upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # #157: the webServer's own wrangler dev process can die mid-run
      # with nothing but a blank `[ERROR]` in the job log — its own
      # debug log is the only place that failure is ever explained, and
      # without this it's unrecoverable after the fact.
      - name: upload wrangler's own debug log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Real Baikal in containers, not mocked fetch — the testing rule's
  # container/integration layer, catching what src/lib/caldav/*.test.ts's
  # mocks can't. See test/integration/compose.yaml's header comment.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: start Baikal and Caddy, then run Baikal's install wizard
        run: bun run test:integration:up
      - name: caldav client against real Baikal
        run: bun run test:integration
      - name: container logs on failure
        if: failure()
        run: docker compose -f test/integration/compose.yaml logs
      - name: tear down
        if: always()
        run: bun run test:integration:down

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
