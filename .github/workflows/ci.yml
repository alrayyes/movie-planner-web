# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0"

jobs:
  # #727: which of the jobs below have files to look at. The lists live in
  # scripts/changed-groups.ts, with a test that pins them, and lefthook.yml's
  # pre-push jobs carry the same globs. A skipped job reports success, so a PR
  # that touches one kind of file still gets a status and can merge. A push to
  # main runs everything, because the release hangs off it. `audit` and
  # `commits` always run: an advisory lands whatever the PR touched, and a
  # commit message is checked on every PR.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.groups.outputs.lint }}
      test: ${{ steps.groups.outputs.test }}
      security: ${{ steps.groups.outputs.security }}
      integration: ${{ steps.groups.outputs.integration }}
      prose: ${{ steps.groups.outputs.prose }}
      mutation: ${{ steps.groups.outputs.mutation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: which groups changed
        id: groups
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            bun scripts/changed-groups.ts "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            bun scripts/changed-groups.ts --all | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: biome check
        run: bun run lint
      - name: oxlint (shadcn/lint Tailwind rules)
        run: bun run lint:tailwind
      - name: cclint (CLAUDE.md and .claude/settings*.json)
        run: bun run lint:claude
      - name: sort-package-json --check
        run: bun run sort-package-json:check
      # TypeScript's own package no longer exposes astro check's compiler
      # API past 6.x — see package.json's pinned version and the tracking
      # issue linked there before bumping it.
      - name: astro check
        run: bun run check

  # Dependabot alerts alone miss the window between a vulnerability's
  # disclosure and Dependabot's own next scan — this runs the ecosystem's
  # own audit tool on every push instead.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      # A red run can be a transient registry failure, not a real finding
      # (rules/ci.md) — retry once before treating it as one.
      #
      # Two advisories are ignored because neither has a patched release
      # (patched_versions null; npm latest is the vulnerable version), so
      # there is nothing to upgrade or pin to (#707). Remove each --ignore
      # when its package ships a fix.
      # - GHSA-ch52-4w7c-c8xp: http-cache-semantics <=4.2.0, via astro.
      #   Cross-user disclosure from a shared HTTP cache. The site is fully
      #   static, with no server-side request handling to leak between users.
      # - GHSA-vfj7-8cjw-p6xm: braces <=3.0.3, via markdownlint-cli2.
      #   Stack exhaustion on deeply nested glob patterns. Dev tooling run
      #   on our own file globs only.
      - name: bun audit
        run: |
          audit() { bun audit --ignore=GHSA-ch52-4w7c-c8xp --ignore=GHSA-vfj7-8cjw-p6xm; }
          audit || (sleep 5 && audit)

  # Biome's pattern-based rules (lint, above) can't do cross-file taint
  # tracking; this is the separate security pass that can — the free
  # Semgrep Registry ruleset, no paid tier or account needed.
  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c # 1.175.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: semgrep scan --config auto --error

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-24.04
    # #640: bumped again alongside playwright.config.ts's own 1-worker-on-
    # CI change and globalTimeout bump — two attempts (the `|| retry`
    # wrapper below) at up to 10 minutes each running fully serial, plus
    # install/build overhead, needs more headroom than 18 gave at the
    # 2-worker pace.
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      # `--with-deps` shells out to `apt-get` against Google's own Chrome
      # repo, not Ubuntu's mirrors — a repo that flakes on its own rotation
      # with a Hash Sum mismatch, unrelated to anything in this repo.
      # ubuntu-24.04 runners already ship the system libraries Playwright's
      # own downloaded Chromium needs, so this skips that dependency
      # entirely rather than racing it. Retry once regardless, since a
      # download can still fail transiently for unrelated reasons.
      - name: install playwright's browser
        run: |
          bunx playwright install chromium ||
            (sleep 5 && bunx playwright install chromium)
      - name: playwright test
        # webServer builds and serves through wrangler itself, the same
        # thing the Cloudflare Worker deploy runs — see playwright.config.ts.
        # bunfig.toml turns coverage on for every `bun test` run, so
        # coverage/lcov.info comes out of this step as a side effect.
        #
        # #501: retries the whole e2e run once — the webServer itself
        # (wrangler/workerd, or esbuild's bundler-watch service under it)
        # has crashed under CI runner load a few different ways, each
        # killing every test still queued behind it in that worker. A
        # fresh run starts a fresh server. Unit tests never touch a
        # server, so they run once, unretried; only the e2e half restarts.
        # #526: this retry only gets a chance to run once the first
        # `playwright test` invocation actually exits — playwright.config.ts's
        # `globalTimeout` is what makes that happen quickly instead of
        # grinding through this job's whole 15-minute timeout first.
        # #574: CODECOV_TOKEN here (not just on the upload actions below)
        # is what astro.config.mjs's own codecovAstroPlugin reads —
        # playwright's webServer spawns `astro build` as this step's own
        # child process, so it inherits whatever's in this step's env.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          bun run test:unit
          bun run test:e2e || (echo "retrying e2e after a possible webServer crash" && bun run test:e2e)
      # Visibility, not a gate (rules/testing.md) — never fails the job,
      # even now that the repo's connected to Codecov.
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # #573: Test Analytics — per-test failure/flake history and a
      # shortest-path-to-green on a red PR, not just the coverage delta
      # above. `!cancelled()` (not the default `success()`) is what makes
      # this run on a red "playwright test" step too — the whole point is
      # showing which test failed, so it has to upload from a failed run,
      # not skip it. Same action, `report_type: test_results` instead of
      # a second dedicated action — codecov/test-results-action is
      # deprecated in favor of this.
      - name: upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: coverage/junit-unit.xml,playwright-report/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      # #195: tests/screenshots.spec.ts overwrites docs/screenshots/*.png
      # on every run — uploaded here so a reviewer can eyeball whether the
      # README's own checked-in copies (committed separately, since CI
      # never commits on its own — see CLAUDE.md) still match, without
      # needing to run the suite themselves.
      - name: upload README screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-screenshots
          path: docs/screenshots/
          retention-days: 7
      - name: upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # #157: the webServer's own wrangler dev process can die mid-run
      # with nothing but a blank `[ERROR]` in the job log — its own
      # debug log is the only place that failure is ever explained, and
      # without this it's unrecoverable after the fact.
      - name: upload wrangler's own debug log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-logs
          path: ~/.config/.wrangler/logs/
          if-no-files-found: ignore
          retention-days: 7

  # Real Baikal in containers, not mocked fetch — the testing rule's
  # container/integration layer, catching what src/lib/caldav/*.test.ts's
  # mocks can't. See test/integration/compose.yaml's header comment.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: start Baikal and Caddy, then run Baikal's install wizard
        run: bun run test:integration:up
      - name: caldav client against real Baikal
        run: bun run test:integration
      - name: container logs on failure
        if: failure()
        run: docker compose -f test/integration/compose.yaml logs
      - name: tear down
        if: always()
        run: bun run test:integration:down

  # #728: mutation testing over src/lib, on the lines a pull request changed.
  # A surviving mutant blocks the merge (rules/testing.md), and scoping the run
  # to the diff is how that holds for new code without failing every PR over the
  # ~1,150 survivors in code nobody touched (a full run is ~9 minutes and scores
  # 50%). Pull requests only: a push to main has no diff to scope to. Not in the
  # pre-push hook, which would add minutes to every push for a check CI runs.
  mutation:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.mutation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Stryker runs on Node, and only its test children run on bun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: bun install
        run: bun install --frozen-lockfile
      - name: changed lines in src/lib
        id: ranges
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: echo "ranges=$(bun scripts/stryker-changed-lines.ts "$BASE" "$HEAD")" | tee -a "$GITHUB_OUTPUT"
      - name: stryker
        if: steps.ranges.outputs.ranges != ''
        env:
          RANGES: ${{ steps.ranges.outputs.ranges }}
        run: bunx stryker run --mutate "$RANGES"
      - name: mutation report
        if: always() && steps.ranges.outputs.ranges != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 7

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # The one check to require (#727): it passes when every job above passed or
  # was skipped, so a path-gated job never leaves a PR waiting on a status that
  # will not come, and a red `audit` or `security` can't be merged past. It
  # replaces listing each job in branch protection. `always()` so it still
  # reports when a job it needs failed or was skipped.
  ci-status:
    if: always()
    needs:
      [
        changes,
        lint,
        audit,
        security,
        test,
        integration,
        mutation,
        prose,
        commits,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
