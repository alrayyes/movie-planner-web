# The dependency advisories already on main (#931). The audit job in ci.yml
# blocks only a pull request that introduces one; this keeps a single open
# `Dependency advisories` ticket that lists the rest, updates it when they
# change and closes it when the audit is clean. Nothing is ignored: an advisory
# with no patched release stays in the ticket until one ships.
name: advisory-scan

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: [package.json, bun.lock]
  workflow_dispatch:

permissions:
  contents: read

env:
  LEFTHOOK: "0"

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: alrayyes/advisory-scan@9801551dad16ce63853b2babfda885365d368232 # v0.3.0
        with:
          mode: scan
          command: bun audit
          labels: dependencies
