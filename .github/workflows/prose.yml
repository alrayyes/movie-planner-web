# The two tiers markdownlint doesn't cover.
#
# Layout is Prettier and structure is markdownlint, both in the ci workflow.
# Those pass a document that reads badly: neither notices "an university",
# "the the", or a paragraph that has quietly gone passive.
#
# Mechanics and style are separate jobs on purpose. When this goes red the
# job name should say which tier failed, because a grammar mistake and a
# style opinion are answered differently — one is wrong, the other is a
# suggestion.
name: prose

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .github/workflows/prose.yml
  pull_request:
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .github/workflows/prose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

# Vale's image is pinned in the `style` job below and again in
# scripts/lint-prose.sh, and a test (scripts/vale-image.test.ts) fails when the
# two differ. Its style packages are versioned separately and fetched by
# `vale sync`. ltex-ls-plus is pinned inside scripts/lint-mechanics.sh instead,
# so the hook and this workflow cannot install different versions of it.

jobs:
  # Mechanics: grammar, spelling, the phonetic article. These have a right
  # answer, so this one fails the build.
  mechanics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the prose this repository owns
        # The same script the pre-push hook runs, so the two cannot disagree
        # about the version, the file list or what counts as a failure.
        run: ./scripts/lint-mechanics.sh

  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The official image, not a Go build: no Go toolchain, no cgo build
    # dependency, no module path to break. It is Alpine with /bin/vale as its
    # entrypoint, so the entrypoint is cleared for a job that runs a shell.
    container:
      # renovate: datasource=docker depName=jdkato/vale
      image: jdkato/vale:v3.17.1@sha256:7dba3c9104ba366f172d119022c4ec53a005f7d14dc1b80e285421a3f0b71657
      options: --entrypoint ""
    steps:
      # The image ships node but neither bash nor git, and the script needs
      # both. Before checkout, so the action can use git.
      - name: Install bash and git
        run: apk add --no-cache bash git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust the workspace
        # The job runs as root over a checkout owned by the runner user, which
        # git refuses to read without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vale
        # The same script the pre-push hook runs, so the two cannot check
        # different files or disagree about what's worth failing on.
        env:
          VALE_REPORT: vale.txt
        run: ./scripts/lint-prose.sh

      - name: Report
        if: always()
        run: |
          {
            echo '### Vale'
            echo
            if [ -s vale.txt ]; then
              echo '```'
              cat vale.txt
              echo '```'
            else
              echo 'Nothing to report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
